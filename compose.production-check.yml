# Isolated local production smoke test. All credentials are test-only.
# Generate .env.production-check as documented in docs/PRODUCTION_ISOLATION.md,
# then run with --env-file. VAPID private keys must never be committed.
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: hotel_platform
      MYSQL_ROOT_PASSWORD: production-check-admin-only
      MYSQL_USER: kadrom_app
      MYSQL_PASSWORD: production-check-app-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
  backend:
    build: ./hotelapp
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: hotel_platform
      DB_USERNAME: kadrom_app
      DB_PASSWORD: production-check-app-only
      JWT_SECRET: production-check-only-secret-at-least-sixty-four-characters-long-12345
      APP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_BASE_URL: http://localhost:8082
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8082
      CLOUDINARY_URL: cloudinary://test:test@test
      GOOGLE_CLIENT_ID: test-client
      GOOGLE_CLIENT_SECRET: test-secret
      # Test-only, format-valid Resend values (prod requires 're_' key + own-domain sender).
      RESEND_API_KEY: re_production_check_only
      RESEND_FROM: bildirim@kadrom.test
      # Supplied from the ignored local env file; no VAPID key is stored in Git.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?generate .env.production-check first}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?generate .env.production-check first}
