# FAZ 0/#4 — Integration test profile (H2 in-memory)
spring:
  datasource:
    url: jdbc:h2:mem:hotel_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
  flyway:
    enabled: false   # test'lerde Hibernate schema yeterli

# JWT (test-only secret)
app:
  jwt:
    secret: dGVzdC1zZWNyZXQta2V5LWZvci1qd3QtaW50ZWdyYXRpb24tdGVzdHMtbWluLTI1Ni1iaXQ=
    expiration-ms: 3600000
    refresh-expiration-ms: 86400000
  base-url: http://localhost:8080
  # E-posta dogrulama kapisi testlerde kapali (ayri testler acarak dogrular)
  auth:
    require-verified-email: false
  rate-limit:
    enabled: false   # test'te bypass — peş peşe register'da 429 yememek için
  # @Scheduled isler testte kendiliginden tetiklenmesin (slotlar gecmise tasindigi icin
  # zamana bagli kirilganlik). Testler isleri dogrudan cagirir. Cron "-" = devre disi;
  # fixed-delay isler kayitli kalir (taskScheduler havuzu yine kurulur) ama ~1 yil sonra baslar.
  scheduling:
    expire-applications-cron: "-"
    sgk-reminder-cron: "-"
    gdpr-anonymize-cron: "-"
    refresh-token-cleanup-cron: "-"
    roster-email-cron: "-"
    hold-expiry-initial-delay-ms: 31536000000
    standby-expiry-initial-delay-ms: 31536000000
    saved-search-initial-delay-ms: 31536000000
    idempotency-evict-initial-delay-ms: 31536000000
    login-attempt-evict-initial-delay-ms: 31536000000
  listing:
    auto-close-initial-delay-ms: 31536000000
  billing:
    reconcile-initial-delay-ms: 31536000000
  outbox:
    relayInitialDelayMs: 31536000000
    cleanupCron: "-"
  pulse:
    initialDelayMs: 31536000000

# OAuth2 client dummy — test'te kullanilmaz ama bean wiring icin gerekli
spring.security.oauth2.client.registration.google:
  client-id: test-client-id
  client-secret: test-client-secret
  scope: openid,profile,email

# Disable external services in tests
cloudinary:
  url: cloudinary://test:test@test
  enabled: false

resend:
  api-key: test-key
  from: test@test.com
  enabled: false

logging:
  level:
    org.springframework: WARN
    com.hotelapp: INFO
    org.hibernate.SQL: WARN
