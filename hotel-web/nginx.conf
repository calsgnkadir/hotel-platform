# SPA servis — react-router client-side route'lari icin index.html fallback.
# API/WS backend'e (localhost:8080) dogrudan gidiyor (build-time VITE_API_URL),
# bu yuzden burada proxy yok; nginx sadece statik dosya + SPA fallback.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statik varliklar uzun cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: bilinmeyen path'ler index.html'e (client router devralir)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
