# AjansHotel — tam yerel stack: MySQL + Spring Boot + React (nginx).
# Kullanim:  cp .env.example .env  &&  docker compose up --build
# Sonra: frontend http://localhost:5174 · API/Swagger http://localhost:8081/swagger-ui
#
# Not: Bu YEREL/portfoy stack'i — canli demo hala Vercel+Railway. Docker onlarin
# yerine gecmez, "clone'la calistir" + DevOps sinyali icin yanlarinda durur.

services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: hotel_platform
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-changeme_root_pw}
    ports:
      # Host 3307 → lokaldeki mevcut MySQL (3306) ile cakismasin
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  backend:
    build: ./hotelapp
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: hotel_platform
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-changeme_root_pw}
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-key-at-least-32-characters-long-!!!}
      # demo profili: DemoSeeder (@Profile("demo")) demo hesaplarini + ornek
      # veriyi kurar. Olmazsa giris denemeleri 401 doner.
      # dev + demo BIRLIKTE: yalniz "demo" yazilirsa varsayilan "dev" profili
      # ezilir (konsol log'u ve dev ayarlari kaybolur). dev, DB'yi zaten
      # env'den okuyor; cakisma yok.
      SPRING_PROFILES_ACTIVE: dev,demo
      # Frontend 5174'te (5173'u yerel Vite dev server kullanabiliyor) —
      # CORS'a eklenmezse tarayici istekleri bloklar.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5174,http://localhost:5173,http://localhost:3000
      # Sema Hibernate entity'lerinden kurulur (test profilinin yaptiginin ayni).
      # FLYWAY KAPALI cunku migration zinciri SIFIRDAN bir DB'de calismiyor:
      # V4 `applications.version` kolonunu MODIFY ediyor ama V1 baseline o kolonu
      # hic olusturmuyor (mevcut DB'lerde onu Hibernate ddl-auto eklemisti).
      # V4'u duzeltmek checksum'i degistirip CANLI Railway DB'sini kirardi —
      # o yuzden migration'lara dokunulmadi, Docker temiz kurulum yapiyor.
      JPA_DDL_AUTO: update
      FLYWAY_ENABLED: "false"
      # Cloudinary bean'i zorunlu (CloudinaryConfig env yoksa fail-fast ediyor).
      # Dummy deger — yerel stack'te gorsel yukleme kullanilmaz, sadece bean
      # wiring icin. Gercek yukleme icin .env'e kendi CLOUDINARY_URL'ini koy.
      CLOUDINARY_URL: ${CLOUDINARY_URL:-cloudinary://test:test@test}
      # Google OAuth bean'i bos client-id ile ayaga kalkmiyor — dummy.
      # Google ile giris denemek istersen .env'e gercek degerleri koy.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-dummy-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-dummy-client-secret}
      # E-posta gonderimi kapali (Resend) — yerel stack'te mail atilmaz.
      RESEND_API_KEY: ${RESEND_API_KEY:-test-key}
      APP_BASE_URL: http://localhost:5174
    ports:
      # Host 8081: IntelliJ'deki yerel backend 8080'i tutabiliyor, cakismasin
      - "8081:8080"
    # Healthcheck paketsiz: temurin imajinda bash var, /dev/tcp ile port 8080
    # acik mi diye bakar (wget/curl imajda olmayabilir).
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./hotel-web
      args:
        VITE_API_URL: http://localhost:8081
    depends_on:
      - backend
    ports:
      - "5174:80"

volumes:
  mysql_data:
